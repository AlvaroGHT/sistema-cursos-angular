
<div class="contenedor-registro">

  <h2>Registrar inscripción</h2>

  <p class="descripcion">
    Completa los datos del estudiante para realizar su inscripción.
  </p>

  <form (ngSubmit)="registrar()">

    <div class="grupo-formulario">

      <label for="nombre">Nombre:</label>

      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="nombre"
        placeholder="Ingresa el nombre"
        required
      >

    </div>

    <div class="grupo-formulario">

      <label for="apellido">Apellido:</label>

      <input
        type="text"
        id="apellido"
        name="apellido"
        [(ngModel)]="apellido"
        placeholder="Ingresa el apellido"
        required
      >

    </div>

    <div class="grupo-formulario">

      <label for="correo">Correo electrónico:</label>

      <input
        type="email"
        id="correo"
        name="correo"
        [(ngModel)]="correo"
        placeholder="ejemplo@correo.com"
        required
      >

    </div>

    <div class="grupo-formulario">

      <label for="cursoId">Seleccionar curso:</label>

      <select
        id="cursoId"
        name="cursoId"
        [(ngModel)]="cursoId"
        required
      >

        <option [ngValue]="0" disabled>Selecciona un curso</option>

        @for (curso of cursos; track curso.id) {
          <option [ngValue]="curso.id">
            {{ curso.nombre }}
          </option>
        }

      </select>

    </div>

    <button type="submit">
      Registrar inscripción
    </button>

    @if (mensaje) {
      <p class="mensaje" [class.exito]="tipoMensaje === 'exito'"
         [class.error]="tipoMensaje === 'error'">
        {{ mensaje }}
      </p>
    }

  </form>

</div>
